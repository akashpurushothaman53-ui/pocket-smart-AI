<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketSmart AI - Welcome Back</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span>PocketSmart</span>
      <span class="brand-badge">AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/register" class="btn btn-nav-primary">Create Account</a></li>
    </ul>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand-logo">PocketSmart</div>
      <div class="auth-brand-sub">AI-Powered Budget Planning</div>
      <h2 class="auth-card-title">Welcome Back</h2>

      <div id="error-alert" style="display: none; background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" value="sai" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" value="password123" required>
          </div>
        </div>

        <div style="text-align: right; margin-bottom: 1.25rem;">
          <a href="#" style="font-size: 0.825rem; color: var(--text-muted); text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem;">
          Sign In &rarr;
        </button>
      </form>

      <div class="auth-card-footer">
        Don't have an account? <a href="/register">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const errBox = document.getElementById("error-alert");
      errBox.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const formData = new FormData();
      formData.append("username", username);
      formData.append("password", password);

      try {
        const response = await fetch("/login", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          window.location.href = "/dashboard";
        } else {
          errBox.textContent = data.detail || "Invalid username or password.";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.textContent = "Network error. Please try again.";
        errBox.style.display = "block";
      }
    });
  </script>

</body>
</html>
